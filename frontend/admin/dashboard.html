<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard | Jain Events & Caterers</title>

    <!-- SEO -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" href="/img/logo.jpg" />
    <link href="/src/css/output.css" rel="stylesheet" />

    <!-- ChartJS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --brand-color: #F8153E;
        }

        body {
            background: #f4f6f9;
        }

        aside {
            transition: 0.3s;
        }

        .collapsed {
            width: 80px !important;
        }

        .collapsed .hide-text {
            display: none;
        }

        /* Skeleton */
        .skeleton {
            height: 16px;
            border-radius: 6px;
            background: linear-gradient(90deg, #eee 25%, #ddd 37%, #eee 63%);
            background-size: 400% 100%;
            animation: shimmer 1.3s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 100% 0;
            }

            100% {
                background-position: -100% 0;
            }
        }

        tbody tr:hover {
            background: rgba(248, 21, 62, .05);
        }

        .page-btn {
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .page-btn.active {
            background: var(--brand-color);
            color: white;
        }
    </style>
</head>

<body class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="bg-white shadow-xl w-64 fixed h-full">

        <div class="p-5 border-b flex justify-between">
            <span class="font-bold text-[var(--brand-color)] hide-text">Jain Admin</span>
            <button onclick="toggleSidebar()">☰</button>
        </div>

        <nav class="p-4 space-y-2">
            <a href="./dashboard.html"
                class="block px-4 py-2 rounded-lg bg-red-50 text-[var(--brand-color)] font-semibold">
                <span class="hide-text">Dashboard</span>
            </a>

            <a href="/blog.html" class="block px-4 py-2 rounded-lg hover:bg-gray-100">
                <span class="hide-text">Blogs</span>
            </a>

            <a href="/menu.html" class="block px-4 py-2 rounded-lg hover:bg-gray-100">
                <span class="hide-text">Menu</span>
            </a>
        </nav>

        <div class="absolute bottom-4 w-full px-4">
            <button onclick="logout()" class="w-full bg-[var(--brand-color)] text-white py-2 rounded-lg">
                <span class="hide-text">Logout</span>
            </button>
        </div>

    </aside>

    <!-- MAIN -->
    <div class="flex-1 ml-64 p-6 space-y-6">

        <!-- HEADER -->
        <div class="flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-700">Dashboard Overview</h1>
            <a href="./add_blog.html" class="bg-[var(--brand-color)] text-white px-6 py-3 rounded-full font-semibold">
                + Add Blog
            </a>
        </div>

        <!-- STATS -->
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

            <div class="bg-white p-6 rounded-xl shadow">
                <p class="text-sm text-gray-500">Total Blogs</p>
                <h2 id="blogCount" class="text-3xl font-bold text-[var(--brand-color)]">0</h2>
            </div>

            <div class="bg-white p-6 rounded-xl shadow">
                <p class="text-sm text-gray-500">Upcoming Events</p>
                <h2 id="eventCount" class="text-3xl font-bold text-[var(--brand-color)]">0</h2>
            </div>

            <div class="bg-white p-6 rounded-xl shadow">
                <p class="text-sm text-gray-500">Messages</p>
                <h2 id="messageCount" class="text-3xl font-bold text-[var(--brand-color)]">0</h2>
            </div>

        </section>

        <!-- CHART -->
        <section class="bg-white p-6 rounded-xl shadow">
            <h2 class="font-semibold mb-3 text-gray-700">
                Blogs Published (Last 6 Months)
            </h2>
            <canvas id="blogChart"></canvas>
        </section>

        <!-- TABLE -->
        <section class="bg-white rounded-xl shadow overflow-hidden">

            <div class="flex justify-between p-5 border-b">
                <h2 class="font-semibold text-gray-700">Manage Blogs</h2>

                <input id="searchInput" placeholder="Search..." class="border px-4 py-2 rounded-full outline-none">
            </div>

            <div class="overflow-x-auto">
                <table class="w-full min-w-[600px]">

                    <thead class="bg-gray-50">
                        <tr>
                            <th class="p-4">Title</th>
                            <th class="p-4">Date</th>
                            <th class="p-4 text-center">Actions</th>
                        </tr>
                    </thead>

                    <tbody id="blogTableBody"></tbody>

                </table>
            </div>

            <div id="pagination" class="p-4 flex gap-2 justify-center"></div>

        </section>

    </div>

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        const token = localStorage.getItem("token");
        if (!token) window.location.href = "/login.html";

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "./login.html";
        }

        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("collapsed");
        }

        let blogsData = [];
        let currentPage = 1;
        const rowsPerPage = 5;

        /* LOAD BLOGS */
        async function loadBlogs() {

            const tbody = document.getElementById("blogTableBody");

            tbody.innerHTML = `
        <tr><td colspan="3" class="p-4"><div class="skeleton w-full"></div></td></tr>
        <tr><td colspan="3" class="p-4"><div class="skeleton w-full"></div></td></tr>
      `;

            const res = await fetch("https://backend-jaine-cforrender.onrender.com/blogs");
            blogsData = await res.json();

            document.getElementById("blogCount").innerText = blogsData.length;

            renderTable();
            renderPagination();
            renderChart();
        }

        /* TABLE */
        function renderTable() {

            const tbody = document.getElementById("blogTableBody");
            tbody.innerHTML = "";

            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;

            blogsData.slice(start, end).forEach(blog => {

                tbody.innerHTML += `
          <tr>
            <td class="p-4">${blog.title}</td>
            <td class="p-4">${new Date(blog.createdAt).toLocaleDateString()}</td>
            <td class="p-4 text-center space-x-2">

              <button onclick="editBlog('${blog._id}')"
                class="bg-blue-500 text-white px-3 py-1 rounded-full">
                Edit
              </button>

              <button onclick="deleteBlog('${blog._id}')"
                class="bg-[var(--brand-color)] text-white px-3 py-1 rounded-full">
                Delete
              </button>

            </td>
          </tr>
        `;
            });
        }

        /* PAGINATION */
        function renderPagination() {

            const pages = Math.ceil(blogsData.length / rowsPerPage);
            const container = document.getElementById("pagination");

            container.innerHTML = "";

            for (let i = 1; i <= pages; i++) {

                const btn = document.createElement("button");
                btn.className = "page-btn " + (i === currentPage ? "active" : "");
                btn.innerText = i;

                btn.onclick = () => {
                    currentPage = i;
                    renderTable();
                    renderPagination();
                };

                container.appendChild(btn);
            }
        }

        /* DELETE */
        async function deleteBlog(id) {

            const confirm = await Swal.fire({
                title: "Delete blog?",
                icon: "warning",
                showCancelButton: true,
                confirmButtonColor: "#d33"
            });

            if (!confirm.isConfirmed) return;

            await fetch(`https://backend-jaine-cforrender.onrender.com/blogs/delete-blog/${id}`, {
                method: "DELETE",
                headers: { Authorization: `Bearer ${token}` }
            });

            loadBlogs();
        }

        /* EDIT */
        async function editBlog(id) {

            const blog = blogsData.find(b => b._id === id);

            const { value } = await Swal.fire({
                title: "Edit Blog",
                input: "text",
                inputValue: blog.title,
                showCancelButton: true
            });

            if (!value) return;

            await fetch(`https://backend-jaine-cforrender.onrender.com/blogs/update-blog/${id}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${token}`
                },
                body: JSON.stringify({ title: value })
            });

            loadBlogs();
        }

        /* CHART */
        function renderChart() {

            const months = {};
            blogsData.forEach(b => {
                const m = new Date(b.createdAt).toLocaleString('default', { month: 'short' });
                months[m] = (months[m] || 0) + 1;
            });

            const labels = Object.keys(months);
            const values = Object.values(months);

            new Chart(document.getElementById("blogChart"), {
                type: "line",
                data: {
                    labels,
                    datasets: [{
                        label: "Blogs",
                        data: values,
                        borderColor: "#F8153E",
                        tension: 0.4,
                        fill: true
                    }]
                }
            });
        }

        window.onload = loadBlogs;
    </script>

</body>

</html>
