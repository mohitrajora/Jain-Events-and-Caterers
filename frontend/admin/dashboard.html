<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard | Jain Events & Caterers</title>

    <!-- SEO Protection -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />

    <link rel="icon" href="/img/logo.jpg" />
    <link href="/src/css/output.css" rel="stylesheet" />

    <!-- Chart JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --brand-color: #F8153E;
        }

        body {
            background: #f4f6f9;
        }

        /* Sidebar collapse */
        .collapsed {
            width: 80px !important;
        }

        .collapsed .hide-text {
            display: none;
        }

        /* Sidebar animation */
        aside {
            transition: 0.3s ease;
        }

        /* Skeleton loader */
        .skeleton {
            background: linear-gradient(90deg, #eee 25%, #ddd 37%, #eee 63%);
            animation: shimmer 1.4s infinite;
            background-size: 400% 100%;
            height: 16px;
            border-radius: 6px;
        }

        @keyframes shimmer {
            0% {
                background-position: 100% 0;
            }

            100% {
                background-position: -100% 0;
            }
        }

        /* Table hover */
        tbody tr:hover {
            background: rgba(248, 21, 62, .05);
        }

        /* Stat hover */
        .stat-card {
            transition: .25s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, .08);
        }

        /* Pagination */
        .page-btn {
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            cursor: pointer;
        }

        .page-btn.active {
            background: var(--brand-color);
            color: white;
            border-color: var(--brand-color);
        }
    </style>
</head>

<body class="flex min-h-screen">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="bg-white shadow-xl w-64 fixed h-full z-40">

        <div class="p-5 border-b flex justify-between items-center">
            <span class="font-bold text-[var(--brand-color)] hide-text">Jain Admin</span>
            <button onclick="toggleSidebar()">☰</button>
        </div>

        <nav class="p-4 space-y-2">

            <a href="./dashboard.html"
                class="block px-4 py-2 rounded-lg bg-red-50 text-[var(--brand-color)] font-semibold">
                <span class="hide-text">Dashboard</span>
            </a>

            <a href="/blog.html" class="block px-4 py-2 rounded-lg hover:bg-gray-100">
                <span class="hide-text">Blogs</span>
            </a>

            <a href="/menu.html" class="block px-4 py-2 rounded-lg hover:bg-gray-100">
                <span class="hide-text">Menu</span>
            </a>

        </nav>

        <div class="absolute bottom-4 w-full px-4">
            <button onclick="logout()" class="w-full bg-[var(--brand-color)] text-white py-2 rounded-lg">
                <span class="hide-text">Logout</span>
            </button>
        </div>

    </aside>

    <!-- MAIN -->
    <div class="flex-1 ml-64 p-6 space-y-6">

        <!-- HEADER -->
        <div class="flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-700">Dashboard Overview</h1>
            <a href="./add_blog.html"
                class="bg-[var(--brand-color)] text-white px-6 py-3 rounded-full font-semibold shadow">
                + Add Blog
            </a>
        </div>

        <!-- STATS -->
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

            <div class="bg-white p-6 rounded-xl shadow stat-card">
                <p class="text-sm text-gray-500">Total Blogs</p>
                <h2 id="blogCount" class="text-3xl font-bold text-[var(--brand-color)]">0</h2>
            </div>

            <div class="bg-white p-6 rounded-xl shadow stat-card">
                <p class="text-sm text-gray-500">Upcoming Events</p>
                <h2 id="eventCount" class="text-3xl font-bold text-[var(--brand-color)]">0</h2>
            </div>

            <div class="bg-white p-6 rounded-xl shadow stat-card">
                <p class="text-sm text-gray-500">Messages</p>
                <h2 id="messageCount" class="text-3xl font-bold text-[var(--brand-color)]">0</h2>
            </div>

        </section>

        <!-- CHART -->
        <section class="bg-white p-6 rounded-xl shadow">
            <h2 class="font-semibold mb-3 text-gray-700">Blog Activity</h2>
            <canvas id="blogChart"></canvas>
        </section>

        <!-- BLOG TABLE -->
        <section class="bg-white rounded-xl shadow overflow-hidden">

            <div class="flex justify-between items-center p-5 border-b">
                <h2 class="font-semibold text-gray-700">Manage Blogs</h2>
                <input id="searchInput" type="text" placeholder="Search..."
                    class="border px-4 py-2 rounded-full outline-none">
            </div>

            <!-- TABLE -->
            <div class="overflow-x-auto">

                <table class="w-full min-w-[600px]">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="p-4">Title</th>
                            <th class="p-4">Date</th>
                            <th class="p-4 text-center">Actions</th>
                        </tr>
                    </thead>

                    <tbody id="blogTableBody"></tbody>

                </table>

            </div>

            <!-- PAGINATION -->
            <div id="pagination" class="p-4 flex gap-2 justify-center"></div>

        </section>

    </div>

    <!-- SWEET ALERT -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>

        /* AUTH */
        const token = localStorage.getItem("token");
        if (!token) window.location.href = "/login.html";

        /* LOGOUT */
        function logout() {
            localStorage.removeItem("token");
            window.location.href = "./login.html";
        }

        /* SIDEBAR COLLAPSE */
        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("collapsed");
        }

        /* PAGINATION */
        let blogsData = [];
        let currentPage = 1;
        const rowsPerPage = 5;

        /* LOAD BLOGS */
        async function loadBlogs() {

            const tbody = document.getElementById("blogTableBody");

            // Skeleton Loader
            tbody.innerHTML = `
        <tr><td colspan="3" class="p-4"><div class="skeleton w-full"></div></td></tr>
        <tr><td colspan="3" class="p-4"><div class="skeleton w-full"></div></td></tr>
        <tr><td colspan="3" class="p-4"><div class="skeleton w-full"></div></td></tr>
      `;

            try {

                const res = await fetch("https://backend-jaine-cforrender.onrender.com/blogs");
                blogsData = await res.json();

                document.getElementById("blogCount").innerText = blogsData.length;

                renderTable();
                renderPagination();
                loadChart();

            } catch {
                tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-red-500">Failed to load blogs</td></tr>`;
            }
        }

        /* TABLE RENDER */
        function renderTable() {

            const tbody = document.getElementById("blogTableBody");
            tbody.innerHTML = "";

            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;

            const pageData = blogsData.slice(start, end);

            pageData.forEach(blog => {

                tbody.innerHTML += `
          <tr>
            <td class="p-4">${blog.title}</td>
            <td class="p-4">${new Date(blog.createdAt).toLocaleDateString()}</td>
            <td class="p-4 text-center">

              <button onclick="deleteBlog('${blog._id}')"
                class="bg-[var(--brand-color)] text-white px-3 py-1 rounded-full">
                Delete
              </button>

            </td>
          </tr>
        `;
            });
        }

        /* PAGINATION RENDER */
        function renderPagination() {

            const pages = Math.ceil(blogsData.length / rowsPerPage);
            const container = document.getElementById("pagination");

            container.innerHTML = "";

            for (let i = 1; i <= pages; i++) {

                const btn = document.createElement("button");
                btn.innerText = i;
                btn.className = "page-btn " + (i === currentPage ? "active" : "");

                btn.onclick = () => {
                    currentPage = i;
                    renderTable();
                    renderPagination();
                };

                container.appendChild(btn);
            }
        }

        /* DELETE BLOG */
        async function deleteBlog(id) {

            const confirm = await Swal.fire({
                title: "Delete blog?",
                icon: "warning",
                showCancelButton: true,
                confirmButtonColor: "#d33"
            });

            if (!confirm.isConfirmed) return;

            await fetch(`https://backend-jaine-cforrender.onrender.com/blogs/delete-blog/${id}`, {
                method: "DELETE",
                headers: { Authorization: `Bearer ${token}` }
            });

            loadBlogs();
        }

        /* CHART */
        function loadChart() {

            const ctx = document.getElementById("blogChart");

            new Chart(ctx, {
                type: "bar",
                data: {
                    labels: ["Blogs"],
                    datasets: [{
                        label: "Total Blogs",
                        data: [blogsData.length],
                        backgroundColor: "#F8153E"
                    }]
                }
            });
        }

        /* SEARCH */
        document.getElementById("searchInput").addEventListener("input", e => {

            const val = e.target.value.toLowerCase();

            blogsData = blogsData.filter(b =>
                b.title.toLowerCase().includes(val)
            );

            currentPage = 1;
            renderTable();
            renderPagination();

        });

        window.onload = loadBlogs;

    </script>

</body>

</html>
