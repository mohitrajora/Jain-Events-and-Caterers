<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard | Jain Events & Caterers</title>

    <!-- SEO Protection -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />

    <link rel="icon" type="image/jpg" href="/img/logo.jpg" />
    <link href="/src/css/output.css" rel="stylesheet" />

    <style>
        :root {
            --brand-color: #F8153E;
        }

        body {
            scroll-behavior: smooth;
        }

        main {
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        nav a {
            padding: 6px 10px;
            font-weight: 500;
            position: relative;
            transition: all 0.2s ease;
        }

        nav a::after {
            content: "";
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0%;
            height: 2px;
            background: white;
            transition: width 0.3s ease;
        }

        nav a:hover::after {
            width: 100%;
        }

        #addBlogBtn {
            box-shadow: 0 4px 10px rgba(248, 21, 62, 0.4);
            transition: all 0.3s ease;
        }

        #addBlogBtn:hover {
            box-shadow: 0 8px 16px rgba(248, 21, 62, 0.5);
            transform: translateY(-1px);
        }

        article {
            transition: all 0.25s ease;
        }

        article:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(248, 21, 62, 0.04);
        }

        button:active {
            transform: scale(0.97);
        }

        @media (max-width: 480px) {
            tbody tr td:last-child {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-[var(--brand-color)] text-white p-5 shadow-lg sticky top-0 z-50">

        <div class="max-w-7xl mx-auto flex justify-between items-center px-4">

            <h1 class="text-2xl font-bold tracking-wide">Admin Dashboard</h1>

            <button id="hamburgerBtn" class="sm:hidden">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" viewBox="0 0 24 24">
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                </svg>
            </button>

            <nav id="navMenu" class="hidden sm:flex gap-4 items-center ml-6">
                <a href="./dashboard.html">Dashboard</a>
                <a href="/blog.html">Blogs</a>
                <a href="/menu.html">Menu</a>
            </nav>

            <button onclick="logout()"
                class="hidden sm:inline-block bg-white text-[var(--brand-color)] px-4 py-2 rounded-full font-semibold hover:bg-gray-100 transition">
                Logout
            </button>

        </div>
    </header>

    <!-- MAIN -->
    <main class="max-w-7xl mx-auto mt-6 px-4 flex flex-col gap-6">

        <!-- ADD BLOG -->
        <div>
            <a href="./add_blog.html" id="addBlogBtn"
                class="inline-block bg-[var(--brand-color)] text-white px-6 py-3 rounded-full font-medium">
                + Add Blog
            </a>
        </div>

        <!-- STATS -->
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

            <article class="bg-white rounded-xl p-6 shadow-md">
                <h2 class="text-lg font-semibold text-gray-700">Total Blogs</h2>
                <p class="text-sm text-gray-500">All published blogs</p>
                <span id="blogCount" class="text-3xl font-bold text-[var(--brand-color)] block mt-3">0</span>
            </article>

            <article class="bg-white rounded-xl p-6 shadow-md">
                <h2 class="text-lg font-semibold text-gray-700">Upcoming Events</h2>
                <p class="text-sm text-gray-500">Confirmed bookings</p>
                <span id="eventCount" class="text-3xl font-bold text-[var(--brand-color)] block mt-3">0</span>
            </article>

            <article class="bg-white rounded-xl p-6 shadow-md">
                <h2 class="text-lg font-semibold text-gray-700">New Messages</h2>
                <p class="text-sm text-gray-500">Unread inquiries</p>
                <span id="messageCount" class="text-3xl font-bold text-[var(--brand-color)] block mt-3">0</span>
            </article>

        </section>

        <!-- BLOG TABLE -->
        <section class="bg-white rounded-xl shadow-md overflow-hidden">

            <div class="flex flex-col sm:flex-row justify-between items-center p-5 gap-3 border-b">

                <h2 class="text-xl font-semibold text-gray-700">All Blogs</h2>

                <input id="searchInput" type="text" placeholder="Search blog title..."
                    class="border rounded-full px-4 py-2 text-sm w-full sm:w-64 focus:ring-2 focus:ring-[var(--brand-color)] focus:outline-none">

            </div>

            <!-- Loader -->
            <div id="loader" class="hidden text-center py-6">
                <svg class="animate-spin h-6 w-6 mx-auto text-[var(--brand-color)]" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
                </svg>
                <p class="text-gray-600 mt-2">Loading blogs...</p>
            </div>

            <div class="overflow-x-auto">

                <table class="w-full min-w-[600px]">

                    <thead class="bg-gray-50">
                        <tr class="text-gray-600 text-left">
                            <th class="p-4">Title</th>
                            <th class="p-4">Date</th>
                            <th class="p-4 text-center">Actions</th>
                        </tr>
                    </thead>

                    <tbody id="blogTableBody"></tbody>

                </table>

            </div>

        </section>

    </main>

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>

        /* ADMIN PROTECTION */
        const token = localStorage.getItem("token");
        if (!token) window.location.href = "/login.html";

        /* LOGOUT */
        function logout() {
            localStorage.removeItem("token");
            Swal.fire({
                icon: "success",
                title: "Logged out",
                timer: 1200,
                showConfirmButton: false
            }).then(() => {
                window.location.href = "./login.html";
            });
        }

        /* MOBILE MENU */
        document.getElementById("hamburgerBtn").onclick = () => {
            document.getElementById("navMenu").classList.toggle("hidden");
        };

        /* LOAD BLOGS */
        async function loadBlogs() {

            const loader = document.getElementById("loader");
            loader.classList.remove("hidden");

            try {

                const res = await fetch("https://backend-jaine-cforrender.onrender.com/blogs");
                const blogs = await res.json();

                loader.classList.add("hidden");

                const tbody = document.getElementById("blogTableBody");
                tbody.innerHTML = "";

                if (!Array.isArray(blogs) || blogs.length === 0) {

                    tbody.innerHTML = `
                        <tr>
                            <td colspan="3" class="p-4 text-center text-gray-500">
                                No blogs found.
                            </td>
                        </tr>`;

                    document.getElementById("blogCount").innerText = 0;
                    return;
                }

                document.getElementById("blogCount").innerText = blogs.length;

                blogs.forEach(blog => {

                    tbody.innerHTML += `
                        <tr>
                            <td class="p-4 font-medium text-gray-700">${blog.title}</td>
                            <td class="p-4 text-gray-500">${new Date(blog.createdAt).toLocaleDateString()}</td>
                            <td class="p-4 text-center space-x-2">

                                <button onclick="editBlog('${blog._id || blog.id}')"
                                    class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded-full transition">
                                    Edit
                                </button>

                                <button onclick="deleteBlog('${blog._id || blog.id}')"
                                    class="bg-[var(--brand-color)] hover:bg-red-700 text-white px-3 py-1 rounded-full transition">
                                    Delete
                                </button>

                            </td>
                        </tr>`;
                });

            } catch (error) {

                loader.classList.add("hidden");

                document.getElementById("blogTableBody").innerHTML = `
                    <tr>
                        <td colspan="3" class="p-4 text-center text-red-500">
                            Failed to load blogs
                        </td>
                    </tr>`;

                Swal.fire("Error", "Failed to load blogs", "error");
            }
        }

        /* DELETE BLOG */
        async function deleteBlog(id) {

            const confirm = await Swal.fire({
                title: "Are you sure?",
                text: "This blog will be permanently deleted!",
                icon: "warning",
                showCancelButton: true,
                confirmButtonColor: "#d33",
                confirmButtonText: "Yes, delete it!"
            });

            if (!confirm.isConfirmed) return;

            try {

                const res = await fetch(
                    `https://backend-jaine-cforrender.onrender.com/blogs/delete-blog/${id}`,
                    {
                        method: "DELETE",
                        headers: {
                            Authorization: `Bearer ${token}`
                        }
                    }
                );

                if (!res.ok) throw new Error();

                Swal.fire({
                    toast: true,
                    icon: "success",
                    title: "Blog deleted",
                    timer: 1500,
                    position: "top-end",
                    showConfirmButton: false
                });

                loadBlogs();

            } catch {

                Swal.fire("Error", "Delete failed", "error");
            }
        }

        /* SEARCH */
        document.getElementById("searchInput").addEventListener("input", e => {

            const value = e.target.value.toLowerCase();

            document.querySelectorAll("#blogTableBody tr").forEach(row => {

                const title = row.children[0]?.textContent.toLowerCase() || "";
                row.style.display = title.includes(value) ? "" : "none";

            });
        });

        window.onload = loadBlogs;

    </script>

</body>

</html>
