<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Details | Jain Events and Caterers</title>

    <!-- Canonical URL -->
    <link rel="canonical" href="" id="canonical-url" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpg" href="/img/logo.jpg" />

    <!-- Tailwind & Fonts -->
    <link href="/src/css/output.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        .font-poppins {
            font-family: 'Poppins', sans-serif;
        }
    </style>

    <!-- AUTO CANONICAL -->
    <script>
        (function () {
            const parts = window.location.pathname.split("/");
            const slug = parts[2];

            if (slug) {
                document.getElementById("canonical-url").href =
                    `https://jain-events-and-caterers.netlify.app/blog/${slug}`;
            } else {
                document.getElementById("canonical-url").href =
                    "https://jain-events-and-caterers.netlify.app/blog";
            }
        })();
    </script>
</head>

<body class="bg-white text-black font-poppins">

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Padding for fixed navbar -->
    <div class="h-20 md:h-24"></div>

    <!-- Blog Details Section -->
    <section class="bg-white py-16 px-6 md:px-12">
        <div class="max-w-4xl mx-auto">

            <!-- Loader -->
            <div id="loader" class="text-center py-20 text-gray-600">
                <svg class="animate-spin h-10 w-10 text-[#F8153E] mx-auto mb-4" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
                </svg>
                <p class="font-medium">Loading blog details...</p>
            </div>

            <!-- Blog Content -->
            <article id="blogContent" class="hidden bg-white border border-gray-200 rounded-2xl shadow-lg p-6 md:p-10">

                <h1 id="blogTitle" class="text-3xl md:text-4xl font-bold text-[#F8153E] mb-4"></h1>

                <p id="blogMeta" class="text-gray-500 text-sm mb-6"></p>

                <!-- Blog Body -->
                <div id="blogBody" class="text-gray-800 leading-relaxed text-lg"></div>

                <div class="mt-10 text-center">
                    <a href="/blog" class="text-[#F8153E] hover:underline font-semibold">
                        ← Back to Blogs
                    </a>
                </div>
            </article>

            <!-- Related Blogs -->
            <section class="mt-16">
                <h2 class="text-2xl font-bold text-[#F8153E] mb-6 text-center">
                    Related Blogs
                </h2>

                <div id="relatedBlogs" class="grid md:grid-cols-3 gap-6"></div>
            </section>

            <!-- Error Message -->
            <div id="errorMessage" class="hidden text-center text-red-600 font-medium mt-10">
                Blog not found.
            </div>

        </div>
    </section>

    <!-- Footer -->
    <footer class="text-center p-4 text-sm text-white bg-[#F8153E]">
        © 2025 Jain Events and Caterers. All rights reserved.
    </footer>

    <!-- BLOG LOGIC -->
    <script>

        // SAFE HTML DECODER
        function decodeHTML(html) {
            if (!html) return "";

            const textarea = document.createElement("textarea");
            textarea.innerHTML = html;

            return textarea.value;
        }

        document.addEventListener("DOMContentLoaded", async () => {

            const loader = document.getElementById("loader");
            const blogContent = document.getElementById("blogContent");
            const blogTitle = document.getElementById("blogTitle");
            const blogMeta = document.getElementById("blogMeta");
            const blogBody = document.getElementById("blogBody");
            const errorMessage = document.getElementById("errorMessage");

            const parts = window.location.pathname.split("/");
            const slug = parts[2];

            if (!slug) {
                loader.classList.add("hidden");
                errorMessage.classList.remove("hidden");
                return;
            }

            // RELATED BLOGS
            async function loadRelatedBlogs(slug) {
                try {
                    const res = await fetch(
                        `https://backend-jaine-cforrender.onrender.com/blogs/related/${slug}`
                    );

                    const blogs = await res.json();
                    const container = document.getElementById("relatedBlogs");

                    if (!blogs.length) {
                        container.innerHTML = `
                          <p class="text-gray-500 col-span-full text-center">
                            No related blogs found.
                          </p>`;
                        return;
                    }

                    container.innerHTML = blogs.map(blog => `
                        <div class="bg-white border rounded-xl shadow-md hover:shadow-xl transition p-5">
                            <h3 class="text-lg font-semibold text-[#F8153E] mb-2">
                                ${blog.title}
                            </h3>
                            <p class="text-sm text-gray-600 mb-4 line-clamp-2">
                                ${(blog.content || "").replace(/<[^>]+>/g, "").slice(0, 100)}...
                            </p>
                            <a href="/blog/${blog.slug}"
                                class="text-[#F8153E] font-medium hover:underline">
                                Read More →
                            </a>
                        </div>
                    `).join("");

                } catch (err) {
                    console.error("Related blogs error:", err);
                }
            }

            try {

                const res = await fetch(
                    `https://backend-jaine-cforrender.onrender.com/blogs/slug/${slug}`
                );

                if (!res.ok) throw new Error("Blog not found");

                const blog = await res.json();

                blogTitle.textContent = blog.title;

                blogMeta.textContent =
                    `Category: ${blog.category || "General"} • ${blog.createdAt || ""}`;

                // MAIN CONTENT RENDER
                blogBody.innerHTML = decodeHTML(blog.content || "");

                // PAGE TITLE
                document.title =
                    `${blog.title} | Jain Events & Caterers`;

                // META DESCRIPTION FIX
                let metaDesc = document.querySelector('meta[name="description"]');

                if (!metaDesc) {
                    metaDesc = document.createElement("meta");
                    metaDesc.setAttribute("name", "description");
                    document.head.appendChild(metaDesc);
                }

                const cleanText = decodeHTML(blog.content || "")
                    .replace(/<[^>]+>/g, "")
                    .slice(0, 150);

                metaDesc.setAttribute("content", cleanText + "...");

                loadRelatedBlogs(slug);

                loader.classList.add("hidden");
                blogContent.classList.remove("hidden");

            } catch (err) {
                console.error(err);
                loader.classList.add("hidden");
                errorMessage.classList.remove("hidden");
            }

        });
    </script>

    <script src="/js/include.js"></script>

</body>

</html>
