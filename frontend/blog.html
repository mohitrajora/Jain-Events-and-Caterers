<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs | Jain Events and Caterers</title>

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Read the latest blogs from Jain Events and Caterers. Get event tips, catering trends, and behind-the-scenes insights from Jaipur’s top catering experts." />

    <!-- Canonical -->
    <link rel="canonical" href="https://jain-events-and-caterers.netlify.app/blog" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpg" href="./img/logo.jpg" />

    <!-- Styles -->
    <link href="src/css/output.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        .font-poppins {
            font-family: 'Poppins', sans-serif;
        }

        /* Preview limit */
        .truncate-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Card hover */
        .blog-card {
            transition: all 0.3s ease;
        }

        .blog-card:hover {
            transform: translateY(-6px);
        }

        /* Category badge */
        .badge {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 999px;
            background: #F8153E;
            color: white;
            font-weight: 500;
        }

        /* Skeleton loader */
        .skeleton {
            animation: pulse 1.5s infinite;
            background: linear-gradient(90deg, #eee, #f5f5f5, #eee);
            background-size: 200% 100%;
        }

        @keyframes pulse {
            0% {
                background-position: 200% 0
            }

            100% {
                background-position: -200% 0
            }
        }
    </style>
</head>

<body class="bg-white text-black font-poppins">

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Padding -->
    <div class="h-20 md:h-24"></div>

    <!-- Blog Section -->
    <section class="bg-white py-16 px-4 md:px-12">

        <div class="max-w-7xl mx-auto text-center">

            <h2 class="text-4xl font-bold text-[#F8153E] mb-4">
                Our Blogs
            </h2>

            <p class="text-gray-600 mb-10">
                Latest catering tips and event insights from Jain Events & Caterers
            </p>

            <!-- Search -->
            <div class="max-w-3xl mx-auto mb-10">
                <input type="text" id="blogSearch" placeholder="Search blogs..."
                    class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-[#F8153E] outline-none">
            </div>

            <!-- Blog Grid -->
            <div class="grid md:grid-cols-3 gap-8" id="blogGrid">

                <!-- Skeleton -->
                <div class="skeleton h-[300px] rounded-xl"></div>
                <div class="skeleton h-[300px] rounded-xl"></div>
                <div class="skeleton h-[300px] rounded-xl"></div>

            </div>

        </div>

    </section>

    <!-- WhatsApp -->
    <a href="https://wa.me/917230888688" target="_blank"
        class="fixed bottom-6 right-6 z-50 flex items-center gap-3 bg-[#25D366] hover:bg-[#1ebe5d] text-white px-4 py-3 rounded-full shadow-xl transition-all hover:scale-105">
        <img src="https://img.icons8.com/color/48/000000/whatsapp--v1.png" class="w-7 h-7">
        <span class="hidden sm:inline font-semibold">WhatsApp Us</span>
    </a>

    <!-- Footer -->
    <footer class="text-center p-4 text-sm text-white bg-[#F8153E]">
        © 2025 Jain Events and Caterers. All rights reserved.
    </footer>

    <!-- SCRIPT -->
    <script>

        function getPreviewText(html, limit = 120) {
            const div = document.createElement("div");
            div.innerHTML = html;
            const text = div.textContent || "";
            return text.length > limit ? text.substring(0, limit) + "..." : text;
        }

        function calculateReadTime(text) {
            const words = text.split(" ").length;
            return Math.max(1, Math.ceil(words / 200));
        }

        function formatDate(date) {
            return new Date(date).toLocaleDateString("en-IN", {
                day: "numeric",
                month: "short",
                year: "numeric"
            });
        }

        document.addEventListener("DOMContentLoaded", async () => {

            const blogGrid = document.getElementById("blogGrid");
            const searchInput = document.getElementById("blogSearch");

            try {

                const res = await fetch("https://backend-jaine-cforrender.onrender.com/blogs");
                const blogs = await res.json();

                blogGrid.innerHTML = "";

                blogs.forEach(blog => {

                    const preview = getPreviewText(blog.content);
                    const readTime = calculateReadTime(preview);
                    const date = formatDate(blog.createdAt);

                    const card = `
<a href="blog/${blog.slug}" class="block blog-card bg-white border rounded-2xl shadow-md overflow-hidden">

    <img loading="lazy"
        src="${blog.image || 'img/JE&C/Blog image.jpg'}"
        alt="${blog.title}"
        class="w-full h-48 object-cover">

    <div class="p-6 text-left">

        <div class="flex justify-between items-center mb-3">
            <span class="badge">${blog.category || "General"}</span>
            <span class="text-xs text-gray-500">${readTime} min read</span>
        </div>

        <h3 class="text-lg font-semibold text-[#F8153E] mb-2">
            ${blog.title}
        </h3>

        <p class="text-gray-600 text-sm truncate-2 mb-4">
            ${preview}
        </p>

        <div class="flex justify-between text-sm text-gray-500">
            <span>${date}</span>
            <span class="text-[#F8153E] font-medium">Read More →</span>
        </div>

    </div>
</a>
`;

                    blogGrid.innerHTML += card;
                });

                // Search Filter
                searchInput.addEventListener("input", e => {
                    const q = e.target.value.toLowerCase();
                    document.querySelectorAll(".blog-card").forEach(card => {
                        const text = card.innerText.toLowerCase();
                        card.style.display = text.includes(q) ? "block" : "none";
                    });
                });

            } catch (err) {
                console.error(err);
                blogGrid.innerHTML = `
<p class="text-red-500 col-span-full text-center">
Failed to load blogs.
</p>`;
            }

        });
    </script>

    <script src="./js/include.js"></script>

</body>

</html>
