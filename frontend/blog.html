<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs | Jain Events and Caterers</title>

    <!-- SEO -->
    <meta name="description"
        content="Read the latest blogs from Jain Events and Caterers. Catering tips, wedding ideas and event trends from Jaipur." />

    <link rel="canonical" href="https://jain-events-and-caterers.netlify.app/blog" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpg" href="./img/logo.jpg" />

    <!-- Styles -->
    <link href="src/css/output.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        .font-poppins {
            font-family: 'Poppins', sans-serif;
        }

        /* Preview limit */
        .truncate-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Card hover */
        .blog-card {
            transition: all 0.3s ease;
        }

        .blog-card:hover {
            transform: translateY(-6px);
        }

        /* Category badge */
        .badge {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 999px;
            background: #F8153E;
            color: white;
            font-weight: 500;
        }

        /* Category filter pills */
        .category-btn {
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid #F8153E;
            color: #F8153E;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }

        .category-btn.active,
        .category-btn:hover {
            background: #F8153E;
            color: white;
        }

        /* Featured blog */
        .featured {
            grid-column: span 2;
        }

        /* Image blur load */
        .blur-load {
            filter: blur(10px);
            transition: filter 0.4s ease;
        }

        .blur-load.loaded {
            filter: blur(0);
        }

        /* Fade animation */
        .fade-in {
            animation: fade 0.4s ease-in;
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-white text-black font-poppins">

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Spacing for navbar -->
    <div class="h-20 md:h-24"></div>

    <!-- Blog Section -->
    <section class="bg-white py-16 px-4 md:px-12">

        <div class="max-w-7xl mx-auto text-center">

            <h2 class="text-4xl font-bold text-[#F8153E] mb-4">
                Our Blogs
            </h2>

            <p class="text-gray-600 mb-8">
                Latest catering tips and event insights from Jain Events & Caterers
            </p>

            <!-- Search -->
            <div class="max-w-3xl mx-auto mb-6">
                <input type="text" id="blogSearch" placeholder="Search blogs..."
                    class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-[#F8153E] outline-none">
            </div>

            <!-- Category Filters -->
            <div class="flex flex-wrap justify-center gap-3 mb-10" id="categoryFilter">
                <button class="category-btn active" data-cat="all">All</button>
                <button class="category-btn" data-cat="wedding">Wedding</button>
                <button class="category-btn" data-cat="birthday">Birthday</button>
                <button class="category-btn" data-cat="corporate">Corporate</button>
                <button class="category-btn" data-cat="festival">Festival</button>
                <button class="category-btn" data-cat="other">Other</button>
            </div>

            <!-- Blog Grid -->
            <div class="grid md:grid-cols-3 gap-8" id="blogGrid">

                <!-- Skeleton -->
                <div class="bg-gray-200 h-[300px] rounded-xl animate-pulse"></div>
                <div class="bg-gray-200 h-[300px] rounded-xl animate-pulse"></div>
                <div class="bg-gray-200 h-[300px] rounded-xl animate-pulse"></div>

            </div>

        </div>

    </section>

    <!-- WhatsApp Button -->
    <a href="https://wa.me/917230888688" target="_blank"
        class="fixed bottom-6 right-6 z-50 flex items-center gap-3 bg-[#25D366] hover:bg-[#1ebe5d] text-white px-4 py-3 rounded-full shadow-xl transition hover:scale-105">
        <img src="https://img.icons8.com/color/48/000000/whatsapp--v1.png" class="w-7 h-7">
        <span class="hidden sm:inline font-semibold">WhatsApp Us</span>
    </a>

    <!-- Footer -->
    <footer class="text-center p-4 text-sm text-white bg-[#F8153E]">
        © 2025 Jain Events and Caterers. All rights reserved.
    </footer>

    <!-- Script -->
    <script>

        let allBlogs = [];
        let activeCategory = "all";

        function getPreviewText(html, limit = 120) {
            const div = document.createElement("div");
            div.innerHTML = html;
            const text = div.textContent || "";
            return text.length > limit ? text.substring(0, limit) + "..." : text;
        }

        function calculateReadTime(text) {
            return Math.max(1, Math.ceil(text.split(" ").length / 200));
        }

        function formatDate(date) {
            return new Date(date).toLocaleDateString("en-IN", {
                day: "numeric",
                month: "short",
                year: "numeric"
            });
        }

        function renderBlogs(blogs) {

            const blogGrid = document.getElementById("blogGrid");
            blogGrid.innerHTML = "";

            blogs.forEach((blog, index) => {

                const preview = getPreviewText(blog.content);
                const readTime = calculateReadTime(preview);
                const date = formatDate(blog.createdAt);

                const featuredClass = index === 0 ? "featured" : "";

                blogGrid.innerHTML += `
<a href="blog/${blog.slug}"
class="block blog-card ${featuredClass} fade-in bg-white border rounded-2xl shadow-md overflow-hidden">

<img loading="lazy"
src="${blog.image || 'img/JE&C/Blog image.jpg'}"
class="blur-load w-full h-48 object-cover"
onload="this.classList.add('loaded')">

<div class="p-6 text-left">

<div class="flex justify-between items-center mb-3">
<span class="badge">${blog.category || "General"}</span>
<span class="text-xs text-gray-500">${readTime} min read</span>
</div>

<h3 class="text-lg font-semibold text-[#F8153E] mb-2">
${blog.title}
</h3>

<p class="text-gray-600 text-sm truncate-2 mb-4">
${preview}
</p>

<div class="flex justify-between text-sm text-gray-500">
<span>${date}</span>
<span class="text-[#F8153E] font-medium">Read More →</span>
</div>

</div>
</a>
`;
            });
        }

        document.addEventListener("DOMContentLoaded", async () => {

            const searchInput = document.getElementById("blogSearch");
            const categoryBtns = document.querySelectorAll(".category-btn");

            const res = await fetch("https://backend-jaine-cforrender.onrender.com/blogs");
            allBlogs = await res.json();

            renderBlogs(allBlogs);

            // Search
            searchInput.addEventListener("input", e => {
                const q = e.target.value.toLowerCase();

                const filtered = allBlogs.filter(blog =>
                    blog.title.toLowerCase().includes(q) ||
                    blog.content.toLowerCase().includes(q)
                );

                renderBlogs(filtered);
            });

            // Category Filter
            categoryBtns.forEach(btn => {

                btn.addEventListener("click", () => {

                    categoryBtns.forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");

                    activeCategory = btn.dataset.cat;

                    if (activeCategory === "all") {
                        renderBlogs(allBlogs);
                    } else {
                        const filtered = allBlogs.filter(blog =>
                            blog.category === activeCategory
                        );
                        renderBlogs(filtered);
                    }

                });

            });

        });

    </script>

    <script src="./js/include.js"></script>

</body>

</html>
